version: '3.8'

services:
  backend:
    build: .
    container_name: plannify-backend
    working_dir: /var/www
    volumes:
      - .:/var/www
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_HOST=db
      - DB_DATABASE=plannify
      - DB_USERNAME=plannify
      - DB_PASSWORD=plannify
    depends_on:
      - db
    command: php artisan serve --host=0.0.0.0 --port=8000

  frontend:
    build: ./frontend
    container_name: plannify-frontend
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:8000
    command: sh -lc "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: plannify-db
    restart: always
    environment:
      MYSQL_DATABASE: plannify
      MYSQL_USER: plannify
      MYSQL_PASSWORD: plannify
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
